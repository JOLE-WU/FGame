name: Build FGame IPA

# Builds the FGame iOS app on a macOS runner.
#   • Every manual run produces an UNSIGNED .ipa whose FILE NAME, the app's
#     own "我的" page and the iOS version fields all carry the version number.
#   • If Apple signing secrets are configured, it ALSO produces a signed
#     .ipa for direct install / TestFlight.
#
# VERSIONING (手动触发时填写，见下方 inputs):
#   version      市场版本号，如 1.0.0 / 1.1.0，默认 1.0.0
#   build_number 构建号，留空自动用本次 run number（每次出包必不重复）
#   产物示例：FGame-v1.0.0-b7-unsigned.ipa，应用内显示 FGame v1.0.0 (7)
#   同时在 FGame-version.txt / Actions 运行摘要里记录版本、commit、时间。
#
# Required for a SIGNED ipa (repo Settings → Secrets and variables → Actions):
#   secrets.APPLE_CERTIFICATE_P12      base64 of the .p12 distribution cert
#   secrets.APPLE_CERTIFICATE_PASSWORD p12 password
#   secrets.APPLE_PROVISIONING_PROFILE base64 of the .mobileprovision
#   secrets.APPLE_TEAM_ID              Apple Developer Team ID
#   secrets.PROVISIONING_PROFILE_UUID  profile UUID
#   vars.FGAME_BUNDLE_ID               e.g. com.yourname.fgame (must match the profile)
#   vars.FGAME_API_BASE                deployed backend URL, e.g. https://api.example.com

on:
  # Manual only. Previously every push started a macOS runner and burned
  # build minutes even when no .ipa was needed. Trigger explicitly from the
  # Actions tab (or `gh workflow run build-ipa.yml -f version=1.0.1`) when a
  # new package is actually going out.
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，如 1.0.0 / 1.1.0（默认 1.0.0）'
        required: false
        default: '1.0.0'
        type: string
      build_number:
        description: '构建号（整数），留空自动用本次运行编号'
        required: false
        default: ''
        type: string

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      FGAME_BUNDLE_ID: ${{ vars.FGAME_BUNDLE_ID || 'com.fgame.daily' }}
      FGAME_API_BASE: ${{ vars.FGAME_API_BASE || '' }}
      DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID || '' }}
      PROVISIONING_PROFILE_UUID: ${{ secrets.PROVISIONING_PROFILE_UUID || '' }}
      EXPORT_METHOD: ${{ vars.EXPORT_METHOD || 'development' }}
      FGAME_VERSION: ${{ inputs.version || '1.0.0' }}
      FGAME_BUILD: ${{ inputs.build_number || github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Validate version metadata
        run: |
          if ! printf '%s' "$FGAME_VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
            echo "::error::版本号格式不合法：$FGAME_VERSION（应形如 1.0.0）"
            exit 1
          fi
          if ! printf '%s' "$FGAME_BUILD" | grep -Eq '^[0-9]+$'; then
            echo "::error::构建号必须是整数：$FGAME_BUILD"
            exit 1
          fi
          echo "### 📦 FGame v${FGAME_VERSION} (build ${FGAME_BUILD})" >> "$GITHUB_STEP_SUMMARY"
          echo "commit: \`$GITHUB_SHA\` · branch: \`$GITHUB_REF_NAME\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Build web bundle
        run: npm run build
        env:
          VITE_API_BASE: ${{ env.FGAME_API_BASE }}

      - name: Generate Capacitor iOS project
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Apply FGame native overrides (icon, name, OAuth bridge, version, signing)
        run: node scripts/prepare-ios.mjs

      - name: Install CocoaPods dependencies
        run: |
          cd ios/App
          pod install --repo-update || pod install

      # ---------- UNSIGNED IPA (always) ----------
      - name: Archive (unsigned)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/FGame.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean archive

      - name: Package unsigned IPA
        run: |
          IPA="FGame-v${FGAME_VERSION}-b${FGAME_BUILD}-unsigned.ipa"
          mkdir -p build/Payload
          cp -R "build/FGame.xcarchive/Products/Applications/App.app" build/Payload/FGame.app
          cd build && zip -qry "../$IPA" Payload
          cd .. && rm -rf build/Payload
          printf 'FGame v%s (build %s)\ncommit: %s\nbranch: %s\nbuilt: %s\n' \
            "$FGAME_VERSION" "$FGAME_BUILD" "$GITHUB_SHA" "$GITHUB_REF_NAME" \
            "$(date -u +%FT%TZ)" > FGame-version.txt
          echo "打包完成：$IPA"
          cat FGame-version.txt

      # ---------- SIGNED IPA (only when secrets present) ----------
      - name: Import signing certificate & provisioning profile
        if: env.DEVELOPMENT_TEAM != ''
        run: |
          echo "${{ secrets.APPLE_CERTIFICATE_P12 }}" | base64 --decode > build/cert.p12
          echo "${{ secrets.APPLE_PROVISIONING_PROFILE }}" | base64 --decode > build/profile.mobileprovision
          KEYCHAIN=build/fgame.keychain-db
          KEYPASS="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYPASS" "$KEYCHAIN"
          security import build/cert.p12 -k "$KEYCHAIN" -P "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYPASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp build/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive + export signed IPA
        if: env.DEVELOPMENT_TEAM != ''
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/FGame-signed.xcarchive" \
            clean archive
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/FGame-signed.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist build/ExportOptions.plist
          cp build/export/App.ipa "FGame-v${FGAME_VERSION}-b${FGAME_BUILD}-signed.ipa"

      # ---------- artifacts ----------
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FGame-IPA-v${{ env.FGAME_VERSION }}-b${{ env.FGAME_BUILD }}
          path: |
            FGame-v*.ipa
            FGame-version.txt
          if-no-files-found: error
