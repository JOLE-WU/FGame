[program:fgame-watchdog]
; Sandbox resume recreates the container: without this, nothing brings
; port 3000 (and the IAP / Epic snapshot loops) back up, so the published
; app shows an endless loading screen until someone logs in.
command=/bin/bash /workspace/FGame/scripts/watchdog.sh
directory=/workspace/FGame
autostart=true
autorestart=unexpected
startsecs=3
stopsignal=TERM
stopwaitsecs=5
stdout_logfile=/tmp/fgame-watchdog-supervisor.log
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
